<main class="page">

<!-- Cookiebanner. Staat er standaard in de HTML en wordt door script.js
     verborgen zodra er een keuze is gemaakt. Zo is hij meteen zichtbaar,
     ook voordat het script geladen is. -->
<div class="cookies" id="cookie-banner" role="dialog" aria-live="polite" aria-label="Cookies" hidden>
  <p class="cookies__text">
    We gebruiken cookies om te zien hoe de site gebruikt wordt. Alleen als jij
    dat goed vindt. Zonder werkt de site gewoon.
  </p>
  <div class="cookies__actions">
    <button type="button" class="btn btn--sm" id="cookie-accept">Accepteren</button>
    <button type="button" class="btn btn--sm btn--ghost" id="cookie-decline">Weigeren</button>
  </div>
</div>

<dialog class="modal" id="form-modal" aria-labelledby="modal-title">
  <div class="modal__head">
    <h2 class="modal__title" id="modal-title">Hou me op de hoogte</h2>
    <button type="button" class="modal__close" id="close-form" aria-label="Sluiten">&times;</button>
  </div>

  <!-- HubSpot vult dit in zodra het script geladen is. Dat script wordt pas
       opgehaald bij de eerste klik op de knop, zodat er niets van HubSpot of
       reCAPTCHA laadt bij een gewoon paginabezoek. -->
  <div class="hs-form-frame" data-region="eu1" data-form-id="3313809b-ae9d-48c7-9a12-b1d08e2b3a7b" data-portal-id="149139429"></div>
</dialog>
